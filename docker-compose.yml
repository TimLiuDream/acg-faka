services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acg-faka-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${ACG_HTTP_PORT:-8080}:80"
    volumes:
      - acg_config:/var/www/html/config
      - acg_install:/var/www/html/kernel/Install
      - acg_runtime:/var/www/html/runtime
      - acg_assets_cache:/var/www/html/assets/cache
      - acg_plugins:/var/www/html/app/Plugin
      - acg_pay:/var/www/html/app/Pay
      # 二开时直接挂载主题目录，修改模板/CSS 后刷新页面即可预览。
      - ./app/View/User/Theme:/var/www/html/app/View/User/Theme
      - ./app/View/Admin:/var/www/html/app/View/Admin
      - ./assets/admin:/var/www/html/assets/admin

  gmpay:
    # 固定已验证的 GM Pay v2.0.0，避免 latest 静默升级后破坏签名协议。
    image: gmwallet/epusdt@sha256:9d2fef82fb875e83f968870bee010ce593ef7bcb5362d09ef1c7f871fa27c55e
    container_name: acg-faka-gmpay
    restart: unless-stopped
    environment:
      EPUSDT_CONFIG: /data/.env
    ports:
      - "127.0.0.1:${GMPAY_HTTP_PORT:-8090}:8000"
    volumes:
      - gmpay_data:/data

  mysql:
    image: mysql:8.0
    container_name: acg-faka-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acg_faka}
      MYSQL_USER: ${MYSQL_USER:-acg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acg_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - acg_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: acg-faka-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - acg_redis:/data

volumes:
  acg_config:
  acg_install:
  acg_runtime:
  acg_assets_cache:
  acg_plugins:
  acg_pay:
  acg_mysql:
  acg_redis:
  gmpay_data:
